[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "freshcite"
dynamic = ["version"]
description = "Wikipedia figures checked against the dataset their citation names"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
freshcite = "freshcite:main"

[tool.setuptools]
py-modules = ["freshcite"]

[tool.setuptools.dynamic]
version = {attr = "freshcite.__version__"}
